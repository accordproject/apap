name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - v4.0.0 # Temporary, while we prepare for merge to main

jobs:
  build:
    name: Unit Tests

    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: git checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install global tools for strict dependency linting
        run: npm install -g lockfile-lint syncpack

      - name: Install dependencies (root + server)
        shell: bash
        run: |
          npm ci
          cd server && npm ci
      - run: npm run build --if-present
      - name: Run tests
        shell: bash
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npm test

      - name: Archive npm failure logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-logs
          path: C:\npm\cache\_logs\

  # Postgres 18 smoke check. Standalone job (services: only run on Linux
  # runners, cannot be attached to the matrix build above). Proves the pinned
  # postgres:18-alpine image stands up cleanly and accepts the app's schema
  # via drizzle-kit push. Follow-up to #229 review: "tested against PG18"
  # is now true in CI, not just in local docker compose.
  postgres-18-smoke:
    name: Postgres 18 schema smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: 1baddeed
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Apply schema to Postgres 18 via drizzle-kit push
        working-directory: server
        env:
          POSTGRES_URL: postgres://postgres:1baddeed@localhost:5432/postgres
        run: npx drizzle-kit push --config drizzle.config.ts

      # Follow-up to Niall's #231 review: "postgres-18-smoke only applies the
      # schema, not that RLS still isolates rows on 18." APAP itself does not
      # yet enable ROW LEVEL SECURITY on any table (the auth chain in
      # handlers/crud.ts is still commented pending the A2A + MCP auth PRs),
      # so this step verifies that the *PG18 RLS feature itself* has not
      # regressed by running a self-contained isolation test against a
      # throwaway table. If PG18 ever ships a change that breaks RLS
      # row-visibility semantics, this step catches it before APAP's own
      # tables start using RLS.
      - name: Verify PG18 RLS isolation semantics with a synthetic policy
        env:
          PGPASSWORD: 1baddeed
        shell: bash
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE _rls_smoke (id int PRIMARY KEY, owner text NOT NULL);
          ALTER TABLE _rls_smoke ENABLE ROW LEVEL SECURITY;
          CREATE POLICY p_owner ON _rls_smoke
              USING (owner = current_setting('app.user_id', true));
          INSERT INTO _rls_smoke VALUES (1, 'alice'), (2, 'bob');

          -- Superusers bypass RLS regardless of FORCE ROW LEVEL SECURITY, and
          -- the CI service runs as `postgres` (SUPERUSER). Demote to a fresh
          -- NOSUPERUSER NOBYPASSRLS role for the assertions so the policy
          -- actually applies. GRANT SELECT so the role can read the throwaway
          -- table.
          CREATE ROLE rls_tester NOSUPERUSER NOBYPASSRLS;
          GRANT SELECT ON _rls_smoke TO rls_tester;
          SET ROLE rls_tester;

          SELECT set_config('app.user_id', 'alice', false);
          DO $$
          DECLARE cnt int;
          BEGIN
              SELECT count(*) INTO cnt FROM _rls_smoke;
              IF cnt <> 1 THEN
                  RAISE EXCEPTION 'RLS regression: alice saw % rows, expected 1', cnt;
              END IF;
          END $$;

          SELECT set_config('app.user_id', 'bob', false);
          DO $$
          DECLARE cnt int;
          BEGIN
              SELECT count(*) INTO cnt FROM _rls_smoke;
              IF cnt <> 1 THEN
                  RAISE EXCEPTION 'RLS regression: bob saw % rows, expected 1', cnt;
              END IF;
          END $$;

          SELECT set_config('app.user_id', 'nobody', false);
          DO $$
          DECLARE cnt int;
          BEGIN
              SELECT count(*) INTO cnt FROM _rls_smoke;
              IF cnt <> 0 THEN
                  RAISE EXCEPTION 'RLS regression: unknown principal saw % rows, expected 0', cnt;
              END IF;
          END $$;

          -- Return to the postgres superuser role before DROP: `rls_tester`
          -- only has GRANT SELECT (not ownership) so a DROP as that role
          -- fails with "must be owner of table _rls_smoke".
          RESET ROLE;
          DROP TABLE _rls_smoke;
          SQL

  publish:
    needs:
      - build
    name: Publish to npm
    # Soft-disabled: this job references `scripts/timestamp.js` and
    # `scripts/bump_version.js` which do not exist in the repo (never have,
    # per `git log --all`). It was previously blocked by the matrix failures
    # #212 fixed, so its own missing-script failure never surfaced. Setting
    # `if: false` keeps main green while the deployment story is figured out
    # in a follow-up. To re-enable, restore the two scripts (or drop the
    # timestamp + bump steps and rely on manual package.json versioning) and
    # replace this line with the original guard, kept below for reference:
    # if: ${{ success() && github.event_name == 'push' && github.repository_owner == 'accordproject' }}
    if: false
    runs-on: ubuntu-latest

    outputs:
      job-status: ${{ job.status }}

    steps:
      - name: git checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install global tools for strict dependency linting
        run: npm install -g lockfile-lint syncpack

      - run: npm ci
      - run: npm run build --if-present

      - name: timestamp
        id: timestamp
        run: |
          node ./scripts/timestamp.js

      - name: build and publish
        run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          node ./scripts/bump_version.js ${{ steps.timestamp.outputs.stamp }}
          npm version --workspaces --include-workspace-root --no-git-tag-version --yes --exact ${{ steps.timestamp.outputs.stamp }}
          npm publish --workspaces --access public --tag=unstable 2>&1